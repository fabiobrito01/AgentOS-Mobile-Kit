name: Build AgentO Mobile Connector v0.3

on:
  pull_request:
    branches: [main]
    paths:
      - 'prototype-termux-bridge/**'
      - '.github/workflows/build-termux-bridge-prototype.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        working-directory: prototype-termux-bridge
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp prototype-termux-bridge/app/build/outputs/apk/debug/app-debug.apk dist/AgentO_Mobile_Connector_v0.3.0_DEBUG.apk
          sha256sum dist/AgentO_Mobile_Connector_v0.3.0_DEBUG.apk > dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AgentO_Mobile_Connector_v0.3.0_DEBUG
          path: dist/*
          if-no-files-found: error
